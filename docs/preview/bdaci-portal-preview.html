<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BDACI Board Portal Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: 3-zone portal shell (top bar / left sidebar / workspace with right rail), plus a standalone sign-in screen.
   Brand tokens are placeholders until BDACI's exact colors are confirmed; the preview bar can swap --brand live. */
:root {
  --logo-blue: #0093cc;      /* from the BDACI logo */
  --logo-green: #7ac143;     /* from the BDACI logo */
  --brand: #0077a8;          /* logo blue, deepened so white text passes contrast */
  --brand-ink: #ffffff;
  --brand-soft: #e3f3fa;
  --accent: #3f8a1f;         /* logo green, deepened for text */
  --green-soft: #eef7e6;
  --grad: linear-gradient(115deg, var(--logo-blue) 0%, #3aa9a6 55%, var(--logo-green) 100%);
  --grad-deep: linear-gradient(120deg, #006a9c 0%, #0a7fb0 45%, #3b8a26 100%);
  --header-bg: #ffffff;
  --warn: #b7791f;           /* action required */
  --warn-soft: #fbf1df;
  --danger: #b23a3a;
  --bg: #f5f7f9;
  --surface: #ffffff;
  --surface-2: #eef2f5;
  --line: #d8dfe6;
  --fg: #1c2a36;
  --muted: #566573;
  --cat-board: #0077a8;
  --cat-edu: #3f8a1f;
  --cat-fin: #b7791f;
  --cat-other: #7a4e9a;
  --focus: #f0b429;
  --font-head: "Ubuntu", "Segoe UI", system-ui, sans-serif;
  --font-body: "Open Sans", "Segoe UI", system-ui, sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #38b3e6; --brand-ink: #07141c; --brand-soft: #10303f; --green-soft: #1a2c14; --header-bg: #121a21;
    --accent: #8fd15a; --warn: #e3a948; --warn-soft: #33281a; --danger: #ec7a7a;
    --bg: #0d1418; --surface: #151f26; --surface-2: #1b2830; --line: #2a3a44;
    --fg: #e4edf2; --muted: #9bb0bc;
    --cat-board: #38b3e6; --cat-edu: #8fd15a; --cat-fin: #e3a948; --cat-other: #b48ad6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #38b3e6; --brand-ink: #07141c; --brand-soft: #10303f; --green-soft: #1a2c14; --header-bg: #121a21;
  --accent: #8fd15a; --warn: #e3a948; --warn-soft: #33281a; --danger: #ec7a7a;
  --bg: #0d1418; --surface: #151f26; --surface-2: #1b2830; --line: #2a3a44;
  --fg: #e4edf2; --muted: #9bb0bc;
  --cat-board: #38b3e6; --cat-edu: #8fd15a; --cat-fin: #e3a948; --cat-other: #b48ad6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font-body); }
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.25; margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
p { margin: 0; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.tabnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { font-family: var(--font-head); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* Preview bar (not part of the portal) */
.previewbar { background: var(--surface-2); border-bottom: 1px dashed var(--line); font-size: .85rem;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.previewbar strong { font-family: var(--font-head); font-weight: 600; }
.previewbar label { display: inline-flex; gap: 6px; align-items: center; }
.previewbar select, .previewbar input[type=color] { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 2px 6px; }
.previewbar input[type=color] { width: 36px; height: 26px; padding: 1px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); padding: 9px 16px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--fg); min-height: 42px; }
.btn:hover { border-color: var(--brand); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.side h4 { color: var(--accent) !important; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-sm { padding: 5px 10px; min-height: 34px; font-size: .9rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brand); text-decoration: underline; cursor: pointer; font: inherit; }

/* Sign-in */
.signin { min-height: calc(100vh - 60px); display: grid; grid-template-columns: 1.05fr 1fr; }
.signin-art { background: var(--grad-deep); color: #ffffff; position: relative; overflow: hidden; padding: 48px max(24px, 5vw); display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.signin-art blockquote { font-family: var(--font-head); font-size: clamp(1.5rem, 3vw, 2.3rem); line-height: 1.2; margin: 0; font-weight: 500; max-width: 16ch; }
.signin-art .org { font-size: .95rem; opacity: .9; max-width: 38ch; }
.signin-form { display: flex; align-items: center; justify-content: center; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.signin-card { width: 100%; max-width: 420px; display: grid; gap: 14px; }
.signin-logo { width: 100%; max-width: 360px; height: auto; margin-bottom: 4px; }
.badge-tile { align-self: flex-start; background: #ffffff; border-radius: 16px; padding: 12px 14px; display: inline-block; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
.badge-tile img { display: block; height: 72px; width: auto; }
.signin-art::after { content: ""; position: absolute; right: -80px; bottom: -80px; width: 320px; height: 320px; border-radius: 50%; border: 28px solid rgba(255,255,255,.08); pointer-events: none; }
.field { display: grid; gap: 5px; }
.field label { font-weight: 700; font-size: .92rem; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 12px; min-height: 44px; }
.field textarea { min-height: 110px; resize: vertical; }
.sso { display: grid; gap: 10px; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.code-input { font-size: 1.6rem; letter-spacing: .4em; text-align: center; font-family: var(--font-head); }
.note { background: var(--brand-soft); border-radius: var(--radius); padding: 10px 12px; font-size: .9rem; }

/* Wordmark (stand-in for the BDACI logo file) */
.brandlogo { display: inline-flex; align-items: center; text-decoration: none; flex: none; }
.brandlogo img { display: block; height: 58px; width: auto; max-width: 100%; }
.brandlogo .lg-badge { display: none; height: 42px; }
.portal-tag { font-family: var(--font-head); font-size: .78rem; color: var(--muted); border-left: 1px solid var(--line); padding-left: 12px; line-height: 1.2; max-width: 12ch; }

/* Shell */
.topbar { background: var(--header-bg); color: var(--fg); border-bottom: 4px solid transparent; border-image: var(--grad) 1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { display: flex; align-items: center; gap: 14px; min-height: 72px; }
.topnav { display: flex; gap: 4px; margin-left: 12px; flex-wrap: wrap; }
.topnav a { color: var(--fg); text-decoration: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: .95rem; opacity: .88; }
.topnav a:hover { background: var(--brand-soft); color: var(--brand); opacity: 1; }
.topnav a[aria-current="page"] { color: var(--brand); opacity: 1; background: var(--brand-soft); }
.userchip { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.avatar { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: var(--brand-soft); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--logo-blue) 45%, var(--logo-green)); color: var(--brand); display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: .85rem; flex: none; }
.userchip .linkbtn { color: var(--brand); }
.menubtn { display: none; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 6px 10px; font-weight: 700; cursor: pointer; }
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 124px); }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; }
.side h4 { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 18px 10px 6px; }
.side h4:first-child { margin-top: 0; }
.side a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 6px; text-decoration: none; color: var(--fg); font-weight: 700; font-size: .95rem; }
.side a:hover { background: var(--surface-2); }
.side a[aria-current="page"] { background: var(--brand-soft); color: var(--brand); box-shadow: inset 3px 0 0 var(--logo-blue); }
.side a .lock { font-size: .72rem; color: var(--muted); font-weight: 400; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.badge-req { background: var(--warn); color: #fff; border-radius: 999px; font-size: .72rem; padding: 1px 8px; }
main.work { padding-block: 28px 48px; padding-left: max(16px, 2.5vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 2.5vw); min-width: 0; display: grid; gap: 22px; align-content: start; }
.pagehead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.pagehead p { max-width: 65ch; margin-top: 4px; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.panel > h2, .panel > .panel-h { margin-bottom: 14px; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.grid-dash { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
.stack { display: grid; gap: 22px; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }

/* Next meeting card */
.next { border: 0; background: var(--grad-deep); color: #ffffff; padding: 26px; display: grid; gap: 18px; }
.next .eyebrow { color: #ffffff; opacity: .85; }
.next h2 { font-size: 1.55rem; }
.next-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.next-meta div { background: rgba(255,255,255,.1); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.next-meta dt { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.next-meta dd { margin: 2px 0 0; font-weight: 700; overflow-wrap: anywhere; }
.next a { color: #ffffff; }
.rsvp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rsvp button { border: 2px solid rgba(255,255,255,.6); background: transparent; color: #ffffff; border-radius: 999px; padding: 7px 16px; font-weight: 700; cursor: pointer; min-height: 40px; }
.rsvp button[aria-pressed="true"] { background: #ffffff; color: #00618c; border-color: #ffffff; }
.rsvp-status { font-size: .9rem; }
.rsvp.on-panel button { border-color: var(--line); color: var(--fg); }
.rsvp.on-panel button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.next .btn { background: transparent; color: #ffffff; border-color: rgba(255,255,255,.6); }
.next .btn-primary { background: #ffffff; color: #00618c; border-color: #ffffff; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .grow b { display: block; overflow-wrap: anywhere; }
.thumb { flex: none; width: 44px; height: 56px; filter: drop-shadow(0 1px 2px rgba(10,40,60,.18)); }
.thumb svg { width: 100%; height: 100%; display: block; }
.folder .thumb { width: 38px; height: 48px; }
.folder { grid-template-columns: auto 1fr; align-items: center; column-gap: 12px; }
.folder > span:last-child { display: grid; gap: 2px; }
.btn .mini-ico { width: 15px; height: 19px; flex: none; }
.btn .mini-ico svg { width: 100%; height: 100%; display: block; }
.doc-ico { width: 34px; height: 40px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: .62rem; font-weight: 700; color: var(--danger); flex: none; font-family: var(--font-head); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.pill-board { background: color-mix(in srgb, var(--cat-board) 16%, transparent); color: var(--cat-board); }
.pill-edu { background: color-mix(in srgb, var(--cat-edu) 16%, transparent); color: var(--cat-edu); }
.pill-fin { background: color-mix(in srgb, var(--cat-fin) 18%, transparent); color: var(--cat-fin); }
.pill-other { background: color-mix(in srgb, var(--cat-other) 16%, transparent); color: var(--cat-other); }
.pill-ok { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-muted { background: var(--surface-2); color: var(--muted); }

/* Mini calendar */
.cal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-h button { background: none; border: 1px solid var(--line); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; }
.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: .85rem; }
.mini .dow { font-size: .7rem; color: var(--muted); font-weight: 700; padding: 4px 0; }
.mini .d { aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; position: relative; max-width: 100%; }
.mini .d.out { color: var(--muted); opacity: .45; }
.mini .d.today { outline: 2px solid var(--brand); }
.mini .d.has { font-weight: 700; cursor: pointer; }
.mini .d .ev { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.mini .d .ev i { width: 5px; height: 5px; border-radius: 50%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: .82rem; margin-top: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.upnext { margin-top: 14px; display: grid; gap: 8px; }
.upnext div { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; font-size: .9rem; }
.datebox { text-align: center; border-radius: 6px; background: var(--brand-soft); color: var(--brand); padding: 4px 0; line-height: 1.1; font-family: var(--font-head); }
.datebox b { display: block; font-size: 1.1rem; }
.datebox small { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* Big calendar */
.bigcal-wrap { overflow-x: auto; }
.bigcal { display: grid; grid-template-columns: repeat(7, minmax(92px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-width: 660px; }
.bigcal .dow { padding: 8px; font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.bigcal .cell { min-height: 104px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; align-content: start; gap: 4px; font-size: .82rem; }
.bigcal .cell.out { background: var(--surface-2); color: var(--muted); }
.bigcal .num { font-weight: 700; font-size: .85rem; }
.bigcal .cell.today .num { background: var(--brand); color: var(--brand-ink); border-radius: 999px; width: 26px; height: 26px; display: grid; place-items: center; }
.evchip { border-left: 4px solid; border-radius: 4px; padding: 3px 6px; background: var(--surface-2); text-align: left; cursor: pointer; border-top: 0; border-right: 0; border-bottom: 0; font-size: .78rem; line-height: 1.3; width: 100%; }

/* Tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .93rem; }
th { text-align: left; font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }

/* Directory */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.person { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; background: var(--surface); min-width: 0; }
.person .top { display: flex; gap: 12px; align-items: center; }
.avatar svg { display: block; width: 100%; height: 100%; }
.person { text-align: center; justify-items: center; }
.person .top { flex-direction: column; }
.person .avatar { width: 96px; height: 96px; }
.person .contact { justify-self: stretch; text-align: left; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.av-sm { width: 30px; height: 30px; box-shadow: none; }
.contact-link { color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; display: inline-block; padding-block: 2px; }
.contact-link:hover { color: var(--accent); }
.who { display: inline-flex; align-items: center; gap: 10px; }
.person a { overflow-wrap: anywhere; }
.term { font-size: .82rem; color: var(--muted); }

/* Folders */
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.folder { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface); text-align: left; cursor: pointer; display: grid; gap: 4px; }
.folder[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
.folder b { font-family: var(--font-head); font-weight: 600; }
.years { display: flex; flex-wrap: wrap; gap: 8px; }
.years button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 700; }
.years button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.side-foot { margin: 24px 10px 0; padding-top: 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; font-size: .8rem; color: var(--muted); }
.side-foot img { height: 44px; width: auto; }

/* Sign-off */
.signoff { border: 2px solid var(--warn); background: var(--warn-soft); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
.signoff.done { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--brand); }
.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--grad); border-radius: 999px; }
.receipt { font-size: .9rem; display: grid; gap: 4px; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: var(--radius); font-weight: 700; z-index: 50; max-width: min(92vw, 520px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }

/* Restricted */
.restricted { text-align: center; padding: 48px 20px; display: grid; gap: 12px; justify-items: center; }
.testbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--warn-soft); border: 1px dashed var(--warn); border-radius: var(--radius); padding: 10px 14px; }
.dropzone { border: 2px dashed color-mix(in srgb, var(--logo-blue) 55%, var(--line)); border-radius: 12px; background: var(--brand-soft); padding: 28px 20px; display: grid; justify-items: center; gap: 6px; text-align: center; cursor: pointer; color: var(--brand); }
.dropzone b { font-family: var(--font-head); font-size: 1.08rem; color: var(--fg); }
.dropzone .muted { max-width: 56ch; }
